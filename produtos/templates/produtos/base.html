<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mercearia do João{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Início</a> |
        <a href="{% url 'produto_list' %}">Produtos</a> |
        <a href="{% url 'produto_new' %}">Novo produto</a>
    </nav>
    <hr>

    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
